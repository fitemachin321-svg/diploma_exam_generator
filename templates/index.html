{% extends 'base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="jumbotron" style="background-color: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 2rem; text-align: center;">
    <h1 class="display-4" style="font-size: 2rem; font-weight: 500; color: #333; margin-bottom: 1rem;">Генератор контрольных работ</h1>
    <p class="lead" style="font-size: 1rem; color: #666;">Автоматическое создание контрольных и самостоятельных работ с вариантами и ответами</p>
    <hr class="my-4">
    {% if user.is_authenticated %}
        <a class="btn" href="{% url 'dashboard' %}" style="background-color: #fff; border: 1px solid #aaa; border-radius: 6px; color: #333; text-decoration: none; padding: 0.5rem 1rem; display: inline-block;">Перейти в панель</a>
    {% else %}
        <a class="btn" href="{% url 'login' %}" style="background-color: #fff; border: 1px solid #aaa; border-radius: 6px; color: #333; text-decoration: none; padding: 0.5rem 1rem; display: inline-block;">Войти</a>
    {% endif %}
</div>
{% endblock %}
